<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Book DJ Huevo for clubs, private events, and San Antonio late-night rooms." />
  <title>DJ Huevo - Booking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&amp;family=Oswald:wght@400;500;600;700&amp;family=Inter:wght@300;400;500;600&amp;display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="booking">
  <header class="archive-nav booking-nav" aria-label="Booking navigation">
    <a class="archive-logo" href="index.html#map">
      <img src="images/dj-huevo-logo.svg" alt="" />
      <span>DJ Huevo</span>
    </a>
    <nav>
      <a href="index.html#map">Rooms</a>
      <button type="button" data-open-shop>Shop All</button>
      <a href="archive.html">Archive</a>
      <a href="#booking-form">Book</a>
    </nav>
    <button class="cart-link archive-cart" type="button" data-open-shop>Cart ( <span data-cart-count>0</span> )</button>
  </header>

  <main class="booking-page">
    <section class="booking-hero">
      <div class="booking-hero-bg" aria-hidden="true"></div>
      <div class="booking-copy">
        <p>DJ Booking / San Antonio</p>
        <h1>Bring Huevo to the room.</h1>
        <span>Clubs, private events, after-hours, brand nights, and house parties. $100/hr minimum.</span>
        <div class="booking-mini-music">
          <b>Music signal</b>
          <div id="booking-streaming" aria-label="Streaming service links"></div>
        </div>
      </div>
      <form class="archive-form booking-form" id="booking-form">
        <div class="booking-form-head">
          <p>Booking Request</p>
          <strong>booking@djhuevo.com</strong>
        </div>
        <input type="text" name="name" placeholder="Name" required />
        <input type="email" name="email" placeholder="Email" required />
        <input type="date" name="event-date" required />
        <input type="text" name="event-type" placeholder="Event type" required />
        <input type="text" name="venue" placeholder="Venue / address" required />
        <input type="text" name="budget" placeholder="Budget" required />
        <textarea name="notes" placeholder="Notes, set length, crowd, music direction" rows="5"></textarea>
        <button type="submit">Send Booking Request</button>
        <p id="form-success" hidden>Request ready in your email app.</p>
      </form>
    </section>
  </main>

  <a class="rooms-jump" href="index.html#map" aria-label="Return to immersive room experience">Enter 6009 House</a>

  <div class="drawer-overlay" id="drawer-overlay" hidden></div>
  <aside class="shop-drawer" id="shop-drawer" aria-labelledby="drawer-title" aria-hidden="true">
    <div class="drawer-header">
      <h2 class="drawer-title" id="drawer-title">The <span>6009</span> Collection</h2>
      <button class="drawer-close" id="drawer-close" type="button" aria-label="Close shop drawer">&times;</button>
    </div>
    <div class="shopify-buy-wrap">
      <div id="collection-component-1778036588622"></div>
    </div>
  </aside>

  <script src="https://sdks.shopifycdn.com/buy-button/latest/buy-button-storefront.min.js"></script>
  <script src="store-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
