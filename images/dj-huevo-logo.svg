<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="title desc">
  <title id="title">DJ Huevo egg mascot logo</title>
  <desc id="desc">A speckled egg mascot with a candle, sleepy eyes, smile, small arms and legs, surrounded by neon confetti.</desc>
  <defs>
    <radialGradient id="eggGradient" cx="38%" cy="28%" r="72%">
      <stop offset="0%" stop-color="#ffe2a8"/>
      <stop offset="42%" stop-color="#d78d45"/>
      <stop offset="100%" stop-color="#9f582f"/>
    </radialGradient>
    <linearGradient id="candleGradient" x1="0" x2="1">
      <stop offset="0%" stop-color="#f8f7e8"/>
      <stop offset="46%" stop-color="#f8f7e8"/>
      <stop offset="47%" stop-color="#39ff14"/>
      <stop offset="62%" stop-color="#39ff14"/>
      <stop offset="63%" stop-color="#f8f7e8"/>
      <stop offset="100%" stop-color="#f8f7e8"/>
    </linearGradient>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.36"/>
    </filter>
    <filter id="speckle">
      <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="3" seed="9"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.22"/>
      </feComponentTransfer>
      <feBlend mode="multiply" in2="SourceGraphic"/>
    </filter>
  </defs>

  <g opacity="0.95">
    <rect x="40" y="70" width="13" height="46" rx="4" fill="#9b30ff" transform="rotate(-27 46 93)"/>
    <rect x="344" y="93" width="16" height="52" rx="5" fill="#ffe135" transform="rotate(34 352 119)"/>
    <rect x="315" y="42" width="12" height="40" rx="4" fill="#39ff14" transform="rotate(-12 321 62)"/>
    <rect x="72" y="328" width="13" height="42" rx="4" fill="#39ff14" transform="rotate(47 78 349)"/>
    <rect x="336" y="360" width="15" height="50" rx="5" fill="#15aee6" transform="rotate(-52 343 385)"/>
    <rect x="95" y="43" width="14" height="43" rx="5" fill="#ff2d7a" transform="rotate(12 102 64)"/>
    <rect x="272" y="430" width="12" height="38" rx="4" fill="#ff2d7a" transform="rotate(18 278 449)"/>
    <rect x="58" y="208" width="10" height="32" rx="4" fill="#15aee6" transform="rotate(-70 63 224)"/>
    <rect x="350" y="240" width="10" height="34" rx="4" fill="#9b30ff" transform="rotate(72 355 257)"/>
  </g>

  <g filter="url(#softShadow)">
    <path d="M196 84c72 0 132 96 132 207 0 107-53 172-132 172S64 398 64 291C64 180 124 84 196 84Z" fill="url(#eggGradient)"/>
    <path d="M196 84c72 0 132 96 132 207 0 107-53 172-132 172S64 398 64 291C64 180 124 84 196 84Z" filter="url(#speckle)" opacity="0.48"/>
    <path d="M145 123c-28 31-47 80-51 134" fill="none" stroke="#fff5d9" stroke-width="22" stroke-linecap="round" opacity="0.18"/>
  </g>

  <g>
    <rect x="178" y="47" width="36" height="58" rx="8" fill="url(#candleGradient)" transform="rotate(7 196 76)"/>
    <path d="M197 28c18 21 5 33-7 33-12 0-17-12 7-33Z" fill="#ffe135"/>
    <path d="M197 38c7 11 1 17-5 17-6 0-8-6 5-17Z" fill="#ff7b1a"/>
  </g>

  <g>
    <rect x="137" y="227" width="50" height="43" rx="11" fill="#f8f7e8"/>
    <rect x="205" y="227" width="50" height="43" rx="11" fill="#f8f7e8"/>
    <rect x="159" y="232" width="16" height="29" rx="8" fill="#070707"/>
    <rect x="226" y="232" width="16" height="29" rx="8" fill="#070707"/>
    <path d="M169 294c18 23 42 23 58 0" fill="none" stroke="#070707" stroke-width="8" stroke-linecap="round"/>
  </g>

  <g fill="none" stroke="#070707" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M81 337c-28 37-24 65 6 79"/>
    <path d="M311 338c27 39 22 67-8 80"/>
    <path d="M156 454v44h-36"/>
    <path d="M235 454v44h35"/>
  </g>
</svg>
